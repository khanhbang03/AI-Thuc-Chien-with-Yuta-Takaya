<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yuta Takaya</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial, sans-serif;
}

a{
    text-decoration:none;
}

.big-text{
    font-size:min(18vw,220px);
    font-weight:900;
    color:white;
    text-transform:uppercase;
    text-align:center;
    cursor:pointer;
    transition:0.3s;
    text-shadow:
        0 0 20px #00ffff,
        0 0 40px #00ffff,
        0 0 80px #00ffff;
}

.big-text:hover{
    transform:scale(1.08);
    text-shadow:
        0 0 30px #00ffff,
        0 0 60px #00ffff,
        0 0 120px #00ffff;
}
</style>
</head>
<body>

<a href="https://aithucchien.vinuni.edu.vn/" target="_blank">
    <div class="big-text">
        Yuta Takaya
    </div>
</a>

</body>
</html>
